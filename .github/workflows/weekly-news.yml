name: Weekly Canada Immigration News

on:
  schedule:
    # 每周一 UTC 时间 01:00 (北京时间上午 9:00 / 加东时间周日晚上 9:00)
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate news
        run: npm run search

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run send
